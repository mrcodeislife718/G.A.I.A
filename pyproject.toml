[project]
name = "gaia-runtime"
version = "0.1.0"
description = "Deterministic governed autonomous intelligence runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
gaia = "gaia.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
